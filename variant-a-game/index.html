<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gut Run</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ad" id="ad" data-state="start">
    <div class="stage" id="stage">
      <img class="layer" src="assets/bg.jpg" width="360" height="640" alt="" draggable="false">
      <div class="scene">
        <img class="layer" src="assets/01_game/bg_texture.png" width="360" height="640" alt="" draggable="false">
        <div class="track">
          <img class="gut" src="assets/01_game/gameplay.png" alt="" draggable="false">
        </div>
      </div>
      <img class="layer" src="assets/border.png" width="360" height="640" alt="" draggable="false">
      <img class="layer" src="assets/01_game/tut.png" width="360" height="640" alt="Bringe Poo durch den Darm ans Ziel." draggable="false">
      <img class="layer" src="assets/logo.png" width="360" height="640" alt="Logo" draggable="false">
      <img class="sprite player" src="assets/01_game/player.png" alt="" draggable="false">
      <img class="sprite gesture" src="assets/gesture.png" alt="tab to run" draggable="false">

      <section class="endcard" id="endcard-fail">
        <img class="layer endcard-bubble fail-bubble" src="assets/02_endcard/fail/bubble.png" width="360" height="640" alt="" draggable="false">
        <img class="layer bacterium fail-bac1" src="assets/02_endcard/fail/bac1.png" width="360" height="640" alt="" draggable="false">
        <img class="layer bacterium fail-bac2" src="assets/02_endcard/fail/bac2.png" width="360" height="640" alt="" draggable="false">
        <img class="layer bacterium fail-bac3" src="assets/02_endcard/fail/bac3.png" width="360" height="640" alt="" draggable="false">
        <img class="layer bacterium fail-bac4" src="assets/02_endcard/fail/bac4.png" width="360" height="640" alt="" draggable="false">
        <img class="layer bacterium fail-bac5" src="assets/02_endcard/fail/bac5.png" width="360" height="640" alt="" draggable="false">
        <img class="layer endcard-poo" src="assets/02_endcard/fail/sad.png" width="360" height="640" alt="" draggable="false">
        <img class="layer endcard-headline" src="assets/02_endcard/fail/hl.png" width="360" height="640" alt="Poo, das tat weh! Erfahre jetzt, was deinem Darm guttut." draggable="false">
        <img class="layer" src="assets/logo.png" width="360" height="640" alt="Logo" draggable="false">
        <button class="endcard-button endcard-cta fail-cta" type="button">
          <img src="assets/02_endcard/fail/cta.png" alt="Jetzt informieren!" draggable="false">
        </button>
        <button class="endcard-button endcard-replay fail-replay" type="button">
          <img src="assets/02_endcard/fail/replay.png" alt="Nochmal spielen" draggable="false">
        </button>
      </section>

      <section class="endcard" id="endcard-win">
        <img class="layer endcard-bubble win-bubble" src="assets/02_endcard/win/bubble.png" width="360" height="640" alt="" draggable="false">
        <img class="layer confetti" src="assets/02_endcard/win/konfetti.png" width="360" height="640" alt="" draggable="false">
        <img class="layer endcard-poo" src="assets/02_endcard/win/happy.png" width="360" height="640" alt="" draggable="false">
        <img class="layer confetti party-cone" src="assets/02_endcard/win/konfetti.png" width="360" height="640" alt="" draggable="false">
        <img class="layer endcard-headline" src="assets/02_endcard/win/hl.png" width="360" height="640" alt="Poo, tut das gut! Wenn du weißt, was dein Darm braucht." draggable="false">
        <img class="layer" src="assets/logo.png" width="360" height="640" alt="Logo" draggable="false">
        <button class="endcard-button endcard-cta win-cta" type="button">
          <img src="assets/02_endcard/win/cta.png" alt="Jetzt mehr erfahren" draggable="false">
        </button>
      </section>

      <button class="mute" type="button" aria-label="Stummschalten" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="mute-speaker" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
          <path class="mute-waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
          <path class="mute-cross" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
    </div>
  </div>
  <script defer src="vendor/gsap.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
